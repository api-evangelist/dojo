        deliveryNotes:
          maxLength: 1024
          type:
          - string
          - 'null'
          description: The delivery notes.
        address:
          oneOf:
          - $ref: '#/components/schemas/Address'
          description: Details about the address.
    TerminalSessionPaymentVerificationMode:
      type: string
