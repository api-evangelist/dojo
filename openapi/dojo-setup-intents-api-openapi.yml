        emailAddress: support@dojo.com
        phoneNumber: '+448000443550'
    ShippingDetails:
      type: object
      additionalProperties: false
      description: Details about the shipping.
      properties:
        name:
          type:
          - string
          - 'null'
          maxLength: 100
