    BillSection:
      type: object
      required:
        - lines
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/BillLine'
      description: An object representing either a header or footer on a BillSection
    BillLine:
      anyOf:
        - title: Image
          required:
            - image
        - title: Logo
          required:
            - logo
        - title: Merchant Address
          required:
            - merchantAddress
        - title: Merchant Email Address
          required:
            - merchantEmailAddress
        - title: Merchant Name
          required:
            - merchantName
        - title: Merchant Phone Number
          required:
            - merchantPhoneNumber
        - title: Text
          required:
            - text
        - title: URL/QR
          required:
            - url
        - title: Horizontal Line
          required:
            - horizontalLine
        - title: Tax Number
          required:
            - taxNumber
      required:
        - lineType
      type: object
      properties:
        image:
          $ref: '#/components/schemas/Image'
        logo:
          $ref: '#/components/schemas/Logo'
        merchantAddress:
          $ref: '#/components/schemas/MerchantAddress'
        merchantEmailAddress:
          $ref: '#/components/schemas/MerchantEmailAddress'
        merchantName:
          $ref: '#/components/schemas/MerchantName'
        merchantPhoneNumber:
          $ref: '#/components/schemas/MerchantPhoneNumber'
        text:
          $ref: '#/components/schemas/Text'
        url:
          $ref: '#/components/schemas/Url'
        horizontalLine:
          $ref: '#/components/schemas/HorizontalLineType'
        taxNumber:
          $ref: '#/components/schemas/TaxNumber'
        lineType:
          $ref: '#/components/schemas/LineType'
    Image:
      required:
        - svgImage
      type: object
      properties:
        svgImage:
          title: svgImage
          type: string
          description: SVG representation of an image
        align:
          $ref: '#/components/schemas/Align'
      description: A bill line containing an image
    Logo:
      required:
        - svgImage
      type: object
      properties:
        svgImage:
          title: svgImage
          type: string
          description: SVG representation of an image
      description: A predefined bill field, containing a logo. This will appear at the top of the bill
    MerchantAddress:
      required:
        - addressLines
        - postcode
      type: object
      properties:
        addressLines:
          title: addressLines
          type: array
          description: Lines of address
          items:
            type: string
        postcode:
          title: postcode
          type: string
          description: ZIP or postal code.
      description: A predefined bill field, containing an address. This will be pre-formatted in the receipt
    MerchantEmailAddress:
      required:
        - emailAddress
      type: object
      properties:
        emailAddress:
          title: emailAddress
          type: string
          description: The email address
      description: A predefined bill field, containing the merchants contact email address. This will be pre-formatted in the bill
    MerchantName:
      required:
        - name
      type: object
      properties:
        name:
          title: name
          type: string
          description: A predefined bill field, containing the merchants name. This will be pre-formatted in the bill
      description: A predefined bill field, containing the merchants name. This will be pre-formatted in the bill
    MerchantPhoneNumber:
      required:
        - phoneNumber
      type: object
      properties:
        phoneNumber:
          title: phoneNumber
          type: string
          description: The phone number
      description: A predefined bill field, containing the merchants contact phone number. This will be pre-formatted in the bill
    Text:
      required:
        - size
        - value
      type: object
      properties:
        value:
          title: value
          type: string
          description: This is the text to be printed for this line. The maxLength of this string depends on the size options used
        size:
          $ref: '#/components/schemas/Size'
        align:
          $ref: '#/components/schemas/Align'
        bold:
          title: bold
          type: boolean
          description: Set this to true if you want the text to be bold. Compatible with all other emphasis flags
      description: A bill line containing text, with optional conditional formatting
    Size:
      type: string
      enum:
        - Body
        - Header1
        - Header2
    Align:
      type: string
      enum:
        - Center
        - Left
        - Right
    Url:
      required:
        - url
      type: object
      properties:
        url:
          title: url
          type: string
          description: The URL for the link
        description:
          title: description
          type: string
          description: Textual description of the URL, will be displayed if set
        showQR:
          title: showQR
          type: boolean
          description: If a QR code should be shown on the bill
        showURL:
          title: showURL
          type: boolean
          description: If the URL should be shown on the bill
      description: A bill line containing a URL. This can be printed as a QR code on bills, or a hyperlink with the text as the description, in digital format.
    HorizontalLineType:
      type: object
      properties:
        line:
          type: string
          enum:
            - Single
            - Double
      description: A bill line containing a horizontal line
    TaxNumber:
      required:
        - name
        - number
      type: object
      properties:
        name:
          title: name
          type: string
          description: The tax name
          example: VAT
        number:
          title: number
          type: string
          description: The tax number
      description: A predefined bill field, containing the merchants tax number. This will be pre-formatted in the bill, and shown at the bottom
    LineType:
      type: string
      enum:
        - Image
        - Logo
        - MerchantAddress
        - MerchantEmailAddress
        - MerchantName
        - MerchantPhoneNumber
        - Text
        - URL
        - HorizontalLine
        - TaxNumber
    OrderItem:
      required:
        - name
        - amountPerItem
        - plu
        - quantity
      type: object
      properties:
        amountPerItem:
          description: The base price of the single item, before any modifiers, subitems or discounts are applied.
          oneOf:
            - $ref: '#/components/schemas/Money'
        quantity:
          type: integer
        note:
          type: string
        name:
          description: A human-readable name of the item.
          type: string
        plu:
          type: string
        subItems:
          description: Sub-items applied to the item
          type: array
          items:
            $ref: '#/components/schemas/OrderSubItem'
        modifiers:
          description: Modifiers applied to the item
          type: array
          items:
            $ref: '#/components/schemas/Modifier'
      x-examples:
        Example 1:
          plu: UGG-BB-PUR-06
          name: test
          price: 0
          quantity: 1073741824
          note: string
          modifiers: []
          subItems: []
    OrderSubItem:
      required:
        - name
        - amountPerItem
        - plu
        - quantity
      type: object
      properties:
        amountPerItem:
          description: The base price of the single sub item, without its parent item, before any modifiers or discounts are applied.
          oneOf:
            - $ref: '#/components/schemas/Money'
        quantity:
          type: integer
        note:
          type: string
        name:
          description: A human-readable name of the item.
          type: string
        plu:
          type: string
        modifiers:
          description: Modifiers applied to the subitem
          type: array
          items:
            $ref: '#/components/schemas/Modifier'
      x-examples:
        Example 1:
          plu: UGG-BB-PUR-06
