          note: string
          modifiers: []
          subItems: []
    SearchOrdersRequest:
      description: ''
      type: object
      properties:
        dineIn:
          $ref: '#/components/schemas/SearchDineInDetails'
        payableOnly:
          description: Return only orders where payable=true
          type: boolean
        cursor:
          $ref: '#/components/schemas/Cursor'
    Table:
      title: Root Type for Table
      description: ''
      required:
        - id
        - name
      type: object
      properties:
        id:
          type: string
        name:
          description: User friendly name to identify the table. Must be unique for an area. Will be displayed on the card machine.
          type: string
        maxCovers:
          format: int32
          description: Max number of covers at this table.
          type: integer
        areaId:
          description: ID of an area
          type: string
        waiterIds:
          description: An array of waiter IDs serving this table
          type: array
          items:
            type: string
      example:
        id: tbl_12345
        name: Table 12
        maxCovers: 4
        areaId: area_123
    TaxLine:
      title: TaxLine
      description: The tax line object.
      required:
        - amountTotal
      type: object
      properties:
        id:
          description: Unique identifier for the object.
          maxLength: 60
          type: string
        name:
          description: A name of the tax.
          maxLength: 100
          type: string
        affectedPlu:
          description: Plu of a product, if it is product specific tax
          type: string
        amountPercentage:
          description: Tax percentage, which is stored with precision 2 (e.g., 25.1% ➜ 2510)
          type: integer
        amountTotal:
          oneOf:
            - $ref: '#/components/schemas/Money'
      additionalProperties: false
    Payment:
      description: Configuration of the payment.
      required:
        - paidAmount
      type: object
      properties:
        paymentIntentId:
          description: ''
          type: string
        paidAmount:
          description: Indicates the paid amount of this specific payment, excluding `tipsAmount` but includes eventual service charges.
          oneOf:
            - $ref: '#/components/schemas/Money'
        tipsAmount:
          description: The tip amount added to this specific payment. It is not included in `paidAmount`.
          oneOf:
            - $ref: '#/components/schemas/Money'
    Area:
      description: A representation of a physcial area in a merchants location.
      required:
        - id
        - name
      type: object
      properties:
        id:
          description: Unique ID of the area
          type: string
        name:
          description: User friendly name of the area
          type: string
          example: ''
        waiterIds:
          description: ''
          type: array
          items:
            type: string
      example:
        id: area_1234
        name: downstairs
