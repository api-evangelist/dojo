- aid: dojo:dojo-epos-data-api
  name: Dojo EPOS Data API
  description: A REST contract that a merchant's EPOS (point-of-sale) system implements so Dojo can read
    orders, tables, areas, parties, and reservations for hospitality integrations. The server is merchant-hosted
    (example server your-epos.example.com); the spec defines the interface Dojo consumes. Version 1.0
    (15 paths).
  humanURL: https://docs.dojo.tech/epos-data/api
