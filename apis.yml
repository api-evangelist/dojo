name: Dojo
kind: company
description: Dojo is a United Kingdom payments company (Paymentsense trading as Dojo, headquartered in
  London) that provides card acquiring and payment processing for in-person, online, and omnichannel merchants.
  It combines Dojo card machines and terminals, a payment gateway, and merchant tooling (bookings, EPOS
  integrations, business banking-style accounts) into a single acquirer-processor stack aimed at UK small
  and mid-market businesses and hospitality. Dojo is genuinely API-native and publishes a public developer
  portal at docs.dojo.tech with a REST API for payment intents, customers, refunds, captures, terminals,
  and webhooks, alongside separate specs for transactions, EPOS data ingestion, and Tap to Pay on iPhone.
  Authentication is a secret API key sent in the Authorization header (sandbox sk_sandbox_ and production
  sk_prod_ prefixes), and the platform supports webhook event subscriptions. Positioned within the UK's
  dense card-acquiring and PSP cluster alongside players like Checkout.com and SumUp.
