- aid: dojo:dojo-api
  name: Dojo API
  description: Dojo's core REST payments API for accepting and managing card payments. Covers payment
    intents, refunds, reversals, captures, customers, setup intents, terminals, terminal sessions, capabilities,
    and webhook event subscriptions. Uses an API key in the Authorization header. Version 2026-02-27 (40
    paths).
